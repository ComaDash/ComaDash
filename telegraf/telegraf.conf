[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://${COMASA_MQTT_HOST}:${COMASA_MQTT_PORT}"]
  topics = ["COMASA/#"]
  qos = 0
  client_id = "comadash-telegraf"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry_raw"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999999Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "site"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "plant"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "area"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "equipment"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "tag"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "variable"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "unit"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "quality"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "scenario"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "from_node"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "to_node"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "fluid"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "unit_generator"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "operating_condition"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source_sheet"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "stage"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
